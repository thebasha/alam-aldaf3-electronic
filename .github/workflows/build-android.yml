name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Build AdMob JavaScript bridge
        run: npx esbuild ads.js --bundle --platform=browser --format=iife --outfile=www/admob.bundle.js
      - name: Configure AdMob application ID
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(p, 'utf8');
          const tag = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8770009560907706~5412734381" />';
          if (!xml.includes('com.google.android.gms.ads.APPLICATION_ID')) xml = xml.replace('</application>', '    ' + tag + '\n  </application>');
          fs.writeFileSync(p, xml);
          NODE
      - name: Sync web app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alam-aldaf3-electronic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
